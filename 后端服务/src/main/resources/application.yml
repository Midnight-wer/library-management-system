server:
  port: 8080
  servlet:
    context-path: /api
    # 强制 HTTP 请求/响应使用 UTF-8, 避免中文乱码
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true
      force-request: true

spring:
  application:
    name: library-admin
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/library_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password:
  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Jackson 日期格式 + UTF-8 输出
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志走 SLF4J, 受 logging.level 控制 (StdOutImpl 会绕过日志框架直接打印全部 SQL)
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath:mapper/*.xml

# JWT 自定义配置
jwt:
  # 密钥
  secret: ZmY0ZTI5YmEzMjQ0YjJhYzIwMjQxNGVkYjI1MGNhZjYK
  # token 有效期(小时)
  expiration: 24

# 文件上传根目录 (相对路径, 服务端本地保存)
file:
  upload-dir: ./uploads
  # 访问前缀
  access-path: /uploads/**

# 日志级别
logging:
  level:
    com.library: debug
    # mapper 包下的 SQL 日志为 DEBUG 级别, 生产环境设为 info 即关闭全量 SQL 打印
    com.library.mapper: info
