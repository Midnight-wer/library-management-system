; ============================================================
;  图书管理系统 - 统一环境配置 (环境配置.ini)
;  被 一键启动.bat / tools\env_bootstrap.ps1 自动读取
;  修改本文件即可调整版本、镜像、数据库与超时参数, 无需改脚本
;  编码要求: GBK(ANSI) + CRLF, 请勿转为 UTF-8
; ============================================================

[系统要求]
; 仅支持 64 位 Windows 10 / Windows 11
OS_NAME=Windows 10/11 (64位)
POWERSHELL_MIN=5.1
; 安装全部便携依赖所需的最小可用磁盘空间 (MB)
DISK_FREE_MIN_MB=4096

[运行时版本]
; JDK 最低版本; 低于该版本或缺失时自动安装 Temurin JDK 8 便携版
JAVA_MIN=1.8
JDK_DIR=jdk
; Node.js 最低主版本; 前端依赖 jsdom 29 要求 Node >= 20.19
NODE_MIN_MAJOR=20
NODE_DIR=node
; MySQL 版本; 缺失时自动安装 MySQL 8.0.28 便携版
MYSQL_VERSION=8.0.28
MYSQL_DIR=mysql
; Maven 无需安装, 后端自带 mvnw.cmd (自动下载 3.8.6)
MAVEN_WRAPPER_VERSION=3.8.6

[运行目录]
; 便携运行时、安装包缓存、日志的根目录 (相对项目根目录)
RUNTIME_DIR=.runtime

[下载镜像]
; 按顺序尝试, 任一镜像失败自动切换下一个
; JDK: 优先 CERNET 教育网镜像, 备用 Azul Zulu 官方 CDN, 最后 Amazon Corretto
; 注: 清华 TUNA / 华为云的较大文件直连返回 403 或 HTML 页面, 故不作为默认镜像
JDK_URL_1=https://mirrors.cernet.edu.cn/Adoptium/8/jdk/x64/windows/OpenJDK8U-jdk_x64_windows_hotspot_8u504b01.zip
JDK_URL_2=https://cdn.azul.com/zulu/bin/zulu8.86.0.25-ca-jdk8.0.452-win_x64.zip
JDK_URL_3=https://corretto.aws/downloads/latest/amazon-corretto-8-x64-windows-jdk.zip
NODE_URL_1=https://npmmirror.com/mirrors/node/v20.19.5/node-v20.19.5-win-x64.zip
NODE_URL_2=https://nodejs.org/dist/v20.19.5/node-v20.19.5-win-x64.zip
MYSQL_URL_1=https://mirrors.huaweicloud.com/mysql/Downloads/MySQL-8.0/mysql-8.0.28-winx64.zip
MYSQL_URL_2=https://mirrors.aliyun.com/mysql/MySQL-8.0/mysql-8.0.28-winx64.zip
; 前端 npm 镜像
NPM_REGISTRY=https://registry.npmmirror.com
; 每个依赖的最大重试次数
DOWNLOAD_RETRY=3

[数据库]
; 需与 后端服务/src/main/resources/application.yml 保持一致
DB_HOST=127.0.0.1
DB_PORT=3306
DB_NAME=library_db
DB_USER=root
DB_PASSWORD=
DB_SQL_FILE=数据库脚本\library.sql
; 本机已安装但未注册服务的 MySQL 兜底启动参数 (全新电脑可留空)
; 留空表示使用项目内置便携版 MySQL (.runtime\mysql + .runtime\mysql\data)
SYS_MYSQL_BIN=
SYS_MYSQL_DATADIR=

[端口]
; 固定端口约定; 如需修改, 请同步修改 application.yml 与 前端界面/vite.config.js
BACKEND_PORT=8080
FRONT_DEV_PORT=5173
FRONT_PROD_PORT=4173

[超时]
MYSQL_WAIT_SECONDS=30
BACKEND_WAIT_SECONDS=90
FRONTEND_WAIT_SECONDS=60

[启动选项]
; 启动完成后是否自动打开浏览器 (1=是, 0=否)
AUTO_OPEN_BROWSER=1

[环境变量]
; 脚本自动设置以下变量并传递给后端/前端子进程:
;   JAVA_HOME  = <项目根目录>\<RUNTIME_DIR>\<JDK_DIR>
;   MYSQL_HOME = <项目根目录>\<RUNTIME_DIR>\<MYSQL_DIR>
;   PATH       = 上述 bin 目录 + 原 PATH
;   NPM_CONFIG_REGISTRY = NPM_REGISTRY
; 额外可选变量 (非空时生效)
MAVEN_OPTS=-Dfile.encoding=UTF-8

; ============================================================
;  第三方依赖清单 (版本锁定, 供环境核对)
;  后端: 由 Maven 按 pom.xml 自动下载
; ============================================================
DEP_BACKEND_SPRING_BOOT=2.7.18
DEP_BACKEND_MYBATIS_PLUS=3.5.3.1
DEP_BACKEND_MYSQL_DRIVER=8.0.33
DEP_BACKEND_JJWT=0.9.1
DEP_BACKEND_JAXB_API=2.3.1
DEP_BACKEND_LOMBOK=1.18.30
DEP_BACKEND_POI_OOXML=4.1.2
DEP_BACKEND_HUTOOL=5.8.16

; ============================================================
;  前端: 由 npm 按 package.json / package-lock.json 自动安装
; ============================================================
DEP_FRONTEND_VUE=3.5.42
DEP_FRONTEND_VUE_ROUTER=4.6.4
DEP_FRONTEND_PINIA=2.3.1
DEP_FRONTEND_ELEMENT_PLUS=2.14.5
DEP_FRONTEND_ELEMENT_PLUS_ICONS=2.3.2
DEP_FRONTEND_AXIOS=1.20.0
DEP_FRONTEND_ECHARTS=5.6.0
DEP_FRONTEND_VITE=5.4.21
DEP_FRONTEND_VITE_PLUGIN_VUE=5.2.4
DEP_FRONTEND_VITEST=2.1.9
DEP_FRONTEND_JSDOM=29.1.1
DEP_FRONTEND_VUE_TEST_UTILS=2.5.0
